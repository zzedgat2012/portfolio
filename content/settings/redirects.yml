redirects:
  - from: /wp-sitemap.xml
    to: /sitemap.xml
    status: 301
  - from: /feed/
    to: /feed.xml
    status: 301
  - from: /article/category/*
    to: /#articles
    status: 301
  - from: /article/tag/*
    to: /#articles
    status: 301
  - from: /project-tag/*
    to: /#projects
    status: 301
